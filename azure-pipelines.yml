trigger: none
pr: none

schedules:
- cron: "43 2 * * *"
  displayName: Nightly UI tests
  branches:
    include:
    - main
  always: true

pool:
  name: 'SelfHosted'

steps:
- checkout: self
  clean: true

# .NET 8 is voldoende voor net8.0 build + testhost
- task: UseDotNet@2
  displayName: "Use .NET SDK 8"
  inputs:
    packageType: 'sdk'
    version: '8.0.x'

- script: dotnet --info
  displayName: "Dotnet info"

- script: dotnet restore "RPG Test Project.sln"
  displayName: Restore

- script: dotnet build "RPG Test Project.sln" --configuration Release --no-restore
  displayName: Build

- script: dotnet test "RpgUiTests\RpgUiTests.csproj" --configuration Release --no-build --logger "trx" --results-directory "$(Agent.TempDirectory)\testresults"
  displayName: Test (RpgUiTests)

- task: PublishTestResults@2
  displayName: Publish test results
  condition: always()
  inputs:
    testResultsFormat: 'VSTest'
    testResultsFiles: '$(Agent.TempDirectory)\testresults\*.trx'
    failTaskOnFailedTests: true

- task: PublishBuildArtifacts@1
  displayName: Publish screenshots/logs
  condition: always()
  inputs:
    pathToPublish: '$(Build.SourcesDirectory)\RpgUiTests\TestResults'
    artifactName: 'ui-test-artifacts'